# CD Pipeline — aula-10
# lint -> test -> build-push (ECR) -> deploy (SSH na EC2) -> health check
name: CD Pipeline (Aula 10)

on:
  push:
    branches: [main]
    paths:
      - 'aula-10/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd-aula10
  cancel-in-progress: false   # deploy pela metade e pior que deploy atrasado

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: technova-aula10-api
  APP_PORT: '3000'
  CONTAINER: technova-api

defaults:
  run:
    working-directory: aula-10/technova-api

jobs:
  # --------------------------------------------------------------- LINT
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  # --------------------------------------------------------------- TEST
  test:
    name: Testes (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  # --------------------------------------------------- BUILD + PUSH (ECR)
  build-push:
    name: Build e push no ECR
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (credenciais de sessao do Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir as tags
        id: meta
        run: |
          REG="${{ steps.login-ecr.outputs.registry }}"
          SHA="${GITHUB_SHA::7}"
          echo "image=${REG}/${ECR_REPO}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        run: |
          REG="${{ steps.login-ecr.outputs.registry }}"
          SHA="${{ steps.meta.outputs.sha }}"
          # --provenance=false: sem isso o buildx gera manifest list com
          # atestacao, e o scan BASIC do ECR nao processa esse formato
          # (aprendido na aula-09).
          docker build --provenance=false \
            -t "${REG}/${ECR_REPO}:sha-${SHA}" \
            -t "${REG}/${ECR_REPO}:latest" .
          docker push "${REG}/${ECR_REPO}:sha-${SHA}"
          docker push "${REG}/${ECR_REPO}:latest"

  # ------------------------------------------------------------- DEPLOY
  deploy:
    name: Deploy na EC2 (Recreate) + health check
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O IP vem da propria AWS, pela tag que o Terraform aplicou: assim o
      # pipeline nao depende de ninguem atualizar um secret quando a
      # instancia e recriada.
      - name: Descobrir o IP da instancia
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=technova-aula10-api" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::error::Nenhuma instancia 'technova-aula10-api' em execucao. Rode o Terraform Apply primeiro."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "IP da instancia: $IP"

      - name: Deploy por SSH (estrategia Recreate)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          envs: AWS_REGION,ECR_REPO,APP_PORT,CONTAINER
          script: |
            set -e
            export AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}'
            export AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}'
            export AWS_SESSION_TOKEN='${{ secrets.AWS_SESSION_TOKEN }}'
            export AWS_DEFAULT_REGION='${{ env.AWS_REGION }}'

            REGISTRY='${{ needs.build-push.outputs.registry }}'
            IMAGE='${{ needs.build-push.outputs.image }}'

            # 1. LOGIN NO ECR ANTES DO PULL — a imagem e privada; sem isso o
            #    pull falha com "no basic auth credentials".
            aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
              | sudo docker login --username AWS --password-stdin "$REGISTRY"

            # 2. Recreate: para e remove o antigo ANTES de subir o novo.
            sudo docker stop  '${{ env.CONTAINER }}' 2>/dev/null || true
            sudo docker rm -f '${{ env.CONTAINER }}' 2>/dev/null || true

            # 3. Puxa a imagem desta execucao (tag de SHA, nao latest).
            sudo docker pull "$IMAGE"

            # 4. Sobe. GITHUB_SHA fica no ambiente para rastreabilidade (BONUS).
            sudo docker run -d \
              --name '${{ env.CONTAINER }}' \
              --restart unless-stopped \
              -p '${{ env.APP_PORT }}':3000 \
              -e GITHUB_SHA='${{ github.sha }}' \
              "$IMAGE"

            sudo docker ps --filter "name=${{ env.CONTAINER }}" --format '{{.Names}} {{.Status}} {{.Image}}'

      - name: Health check pos-deploy
        run: |
          URL="http://${{ steps.ec2.outputs.ip }}:${{ env.APP_PORT }}/health"
          echo "Verificando $URL"
          for i in $(seq 1 20); do
            if RESP=$(curl -fsS -m 5 "$URL" 2>/dev/null); then
              echo "✅ health check OK na tentativa $i"
              echo "$RESP"
              echo "## Deploy concluido" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "Imagem: \`${{ needs.build-push.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "tentativa $i: ainda nao respondeu, aguardando..."
            sleep 6
          done
          echo "::error::Health check falhou apos 20 tentativas — o deploy nao subiu."
          exit 1

      # BONUS: deixa registrado no proprio commit que o deploy foi feito.
      - name: Comentar o resultado no commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                `## ${ok ? '✅' : '❌'} Deploy — Aula 10`,
                '',
                `| | |`,
                `|---|---|`,
                `| Imagem | \`${{ needs.build-push.outputs.image }}\` |`,
                `| Host | \`${{ steps.ec2.outputs.ip }}\` |`,
                `| Estratégia | Recreate |`,
                `| Health check | ${ok ? 'passou' : 'falhou'} |`,
              ].join('\n'),
            });
