# Security Scan (Aula 09) — BONUS: workflow dedicado a seguranca, separado do
# AI review. Roda em PR, na main e semanalmente (vulnerabilidade nova aparece
# sem ninguem mexer no codigo).
name: Security Scan (Aula 09)

on:
  pull_request:
    paths: ['aula-09/**', '.github/workflows/security-scan.yml']
  push:
    branches: [main]
    paths: ['aula-09/**', '.github/workflows/security-scan.yml']
  schedule:
    - cron: '0 6 * * 1'        # toda segunda, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencias:
    name: Auditoria de dependencias (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-09
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-09/package-lock.json
      - run: npm ci

      # O que BLOQUEIA e so o que vai para a imagem. O Dockerfile e multi-stage
      # e instala com --omit=dev, entao vulnerabilidade de jest/babel nunca
      # chega ao runtime: reprovar por ela seria alarme falso.
      - name: npm audit — dependencias de PRODUCAO (bloqueia em high)
        working-directory: aula-09
        run: npm audit --omit=dev --audit-level=high

      # Relatorio completo, incluindo devDependencies. Informativo, nao bloqueia.
      - name: npm audit — arvore completa (informativo)
        working-directory: aula-09
        if: always()
        run: npm audit || true

  imagem:
    name: Scan da imagem Docker (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        working-directory: aula-09
        run: docker build -t technova-api:scan .

      - name: Trivy — relatorio completo (nao bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: technova-api:scan
          format: table
          exit-code: '0'
          vuln-type: 'os,library'

      - name: Trivy — bloqueia em CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: technova-api:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
